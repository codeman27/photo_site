# Cloudflare Pages + Functions config.
# Deploy with: npx wrangler pages deploy .
#
# Email binding — enables env.EMAIL.send() in functions/api/contact.js.
# After deploying, onboard your domain at:
#   https://dash.cloudflare.com → Email Sending → Onboard Domain
# Then set FROM_DOMAIN in functions/api/contact.js to that domain.

name = "rawbe-photography"
pages_build_output_dir = "."
compatibility_date = "2024-09-23"

[[send_email]]
name = "EMAIL"
remote = true
