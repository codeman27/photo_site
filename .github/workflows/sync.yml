name: Sync Nostr photos

# Daily relay check: re-fetches the creator's full photo list (NIP-94 kind-1063
# events), and commits data/images.json ONLY when something actually changed
# (new photos, removals, caption/tag edits).
# Reading public Nostr events needs no credentials, so the sync step itself
# has no required secrets.
#
# When a change is committed and pushed, this workflow fires a Cloudflare Pages
# Deploy Hook — a single POST to a secret URL that triggers the same native
# deployment Cloudflare runs on a PR merge. No wrangler, no account IDs.
#
# Required repository secret:
#   CLOUDFLARE_DEPLOY_HOOK — the full deploy hook URL from the Cloudflare Pages
#     dashboard: Settings → Builds & deployments → Deploy hooks → Add hook.

on:
  schedule:
    - cron: "0 13 * * *" # once a day, 13:00 UTC
  workflow_dispatch: # manual "Run workflow" button in the Actions tab

permissions:
  contents: write

# Serialize runs: a manual dispatch overlapping the cron (or two dispatches)
# must not race the commit+push step.
concurrency:
  group: sync-images
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync data/images.json from Nostr relays
        run: node scripts/sync-nostr.js

      - name: Commit updated data/images.json
        id: commit
        run: |
          if git diff --quiet -- data/images.json; then
            echo "No changes on the relays — nothing to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/images.json
          git commit -m "Sync Nostr photos ($(date -u +%Y-%m-%d))"
          # A human push may have landed between checkout and push.
          git pull --rebase
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Trigger Cloudflare Pages deploy only when data actually changed and was pushed.
      # Posting to the deploy hook fires the same native Cloudflare deployment that
      # a PR merge would trigger — no wrangler CLI or wrangler.toml needed.
      - name: Trigger Cloudflare Pages deploy hook
        if: steps.commit.outputs.pushed == 'true'
        run: |
          curl --fail-with-body -X POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}"
