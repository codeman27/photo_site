name: Sync Nostr photos

# Daily relay check: re-fetches the creator's full photo list (NIP-94 kind-1063
# events), and commits data/images.json ONLY when something actually changed
# (new photos, removals, caption/tag edits).
# Reading public Nostr events needs no credentials, so the sync step itself
# has no required secrets.
#
# When a change is committed and pushed, this workflow also explicitly deploys
# to Cloudflare Pages so the live site updates immediately rather than waiting
# for Cloudflare's own Git integration to poll.
# Required repository secrets for the Cloudflare deploy step:
#   CLOUDFLARE_API_TOKEN  — a Cloudflare API token with "Cloudflare Pages: Edit"
#                           permission (Settings → Secrets and variables → Actions)
#   CLOUDFLARE_ACCOUNT_ID — your Cloudflare account ID (visible in the dashboard
#                           sidebar URL or Account Home → right-hand panel)

on:
  schedule:
    - cron: "0 13 * * *" # once a day, 13:00 UTC
  workflow_dispatch: # manual "Run workflow" button in the Actions tab

permissions:
  contents: write

# Serialize runs: a manual dispatch overlapping the cron (or two dispatches)
# must not race the commit+push step.
concurrency:
  group: sync-images
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync data/images.json from Nostr relays
        run: node scripts/sync-nostr.js

      - name: Commit updated data/images.json
        id: commit
        run: |
          if git diff --quiet -- data/images.json; then
            echo "No changes on the relays — nothing to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/images.json
          git commit -m "Sync Nostr photos ($(date -u +%Y-%m-%d))"
          # A human push may have landed between checkout and push.
          git pull --rebase
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Deploy to Cloudflare Pages only when data actually changed and was pushed.
      # This ensures the live site reflects the sync immediately, without relying
      # on Cloudflare's Git integration polling delay.
      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.pushed == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=rawbe-photography --branch=main
