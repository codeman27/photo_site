name: Sync Nostr photos

# Daily relay check: re-fetches the creator's full photo list (NIP-94 kind-1063
# events), and commits data/images.json ONLY when something actually changed
# (new photos, removals, caption/tag edits).
# There are no tokens and no secrets — reading public Nostr events needs no
# credentials, so this workflow can never lock itself out.

on:
  schedule:
    - cron: "0 13 * * *" # once a day, 13:00 UTC
  workflow_dispatch: # manual "Run workflow" button in the Actions tab

permissions:
  contents: write

# Serialize runs: a manual dispatch overlapping the cron (or two dispatches)
# must not race the commit+push step.
concurrency:
  group: sync-images
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync data/images.json from Nostr relays
        run: node scripts/sync-nostr.js

      - name: Commit updated data/images.json
        run: |
          if git diff --quiet -- data/images.json; then
            echo "No changes on the relays — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/images.json
          git commit -m "Sync Nostr photos ($(date -u +%Y-%m-%d))"
          # A human push may have landed between checkout and push.
          git pull --rebase
          git push

      - name: Trigger Cloudflare Pages deploy
        if: success() && secrets.CF_DEPLOY_HOOK != ''
        env:
          CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: curl -X POST "$CF_DEPLOY_HOOK"
